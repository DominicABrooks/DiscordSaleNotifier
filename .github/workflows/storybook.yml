name: Storybook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write  # upload-artifact steps

jobs:
  visual:
    timeout-minutes: 30
    # Baselines are committed from Windows, so this stays on Windows for identical font rendering.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (frontend)
        run: npm ci
        working-directory: frontend

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: frontend
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Install dependencies (tests)
        run: npm ci
        working-directory: tests

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: tests

      - name: Run Storybook visual tests
        run: npx playwright test --config storybook-visual.config.ts
        working-directory: tests

      - name: Upload Storybook build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 30

      - name: Upload visual diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-diffs
          path: tests/test-results/
          retention-days: 30

      - name: Upload visual report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-report
          path: tests/playwright-report/
          retention-days: 30
